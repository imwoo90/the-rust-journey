name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Dioxus CLI
        run: |
          curl -L https://github.com/DioxusLabs/dioxus/releases/download/v0.7.9/dx-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          chmod +x dx
          mv dx /usr/local/bin/
          
      - name: Build with Dioxus
        run: |
          dx build --release --ssg

      - name: Post Build Adjustments
        run: |
          # Copy SSG output from target/dx/my_blog/release/web/public/
          mkdir -p docs
          cp -r target/dx/my_blog/release/web/public/* docs/
          
          # Clean up /./ dots and prepend REPO_NAME to absolute asset/route URLs
          REPO_NAME=$(echo ${{ github.repository }} | cut -d'/' -f2)
          find docs -type f \( -name "*.html" -o -name "*.js" \) -exec sed -i "s|/./|/|g" {} \;
          find docs -name "*.html" -exec sed -i "s|href=\"/|href=\"/$REPO_NAME/|g" {} \;
          find docs -name "*.html" -exec sed -i "s|src=\"/|src=\"/$REPO_NAME/|g" {} \;
          find docs -name "*.js" -exec sed -i "s|/assets/|/$REPO_NAME/assets/|g" {} \;
          find docs -name "*.js" -exec sed -i "s|/wasm/|/$REPO_NAME/wasm/|g" {} \;
          
          # Manually inject <base> tag into all pre-rendered HTML files (Crucial for GitHub Pages)
          find docs -name "*.html" -exec sed -i "s|<head>|<head><base href=\"/$REPO_NAME/\">|" {} \;
          
          # Disable Jekyll processing for GitHub Pages
          touch docs/.nojekyll
          
          # Support SPA routing fallback on refresh
          cp docs/index.html docs/404.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          branch: gh-pages
          clean: true